name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an upstream geocoder change shows up as a red build.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The live geocoder check runs on a schedule rather than per-PR, so an
  # upstream API change surfaces as a broken build instead of as a bug report.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: DROPIN_LIVE=1 npm test
